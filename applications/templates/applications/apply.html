{% extends "base.html" %}

{% block title %}Apply for {{ job.title }} - DevHire{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 680px;">
    <h2>Submit Your <span style="color: var(--primary);">Application</span></h2>
    <p class="subtitle">
        Applying for: <strong>{{ job.title }}</strong> at <strong>{{ job.company }}</strong> ({{ job.location }})
    </p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    value="{% if user.get_full_name %}{{ user.get_full_name }}{% else %}{{ user.username }}{% endif %}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="e.g. alex@example.com"
                    value="{{ user.email }}"
                    required
                >
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="e.g. +91 9876543210"
                    required
                >
            </div>

            <div class="form-group">
                <label for="skills">Your Core Skills *</label>
                <input
                    type="text"
                    id="skills"
                    name="skills"
                    placeholder="e.g. Python, Django, SQL"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="resume">Attach Resume (PDF / DOCX)</label>
            <input
                type="file"
                id="resume"
                name="resume"
                style="padding: 9px;"
            >
        </div>

        <div class="form-group">
            <label for="cover_letter">Cover Note / Introduction</label>
            <textarea
                id="cover_letter"
                name="cover_letter"
                rows="5"
                placeholder="Briefly highlight why your background fits this role..."
            ></textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 10px;">
            <button type="submit" class="btn" style="flex: 1; padding: 12px;">
                🚀 Submit Application
            </button>
            <a href="/jobs/details/{{ job.id }}/" class="btn btn-secondary" style="padding: 12px 24px;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
