{% extends "base.html" %}

{% block title %}Post a New Vacancy - DevHire{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 720px;">
    <h2>Post a New <span style="color: var(--primary);">Developer Opening</span></h2>
    <p class="subtitle">Publish your job opportunity to connect with qualified engineers on DevHire.</p>

    {% if error %}
        <div style="background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-weight: 600; font-size: 14px;">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Job Title *</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Senior Python / Django Developer"
                required
            >
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="company">Company Name *</label>
                <input
                    type="text"
                    id="company"
                    name="company"
                    placeholder="e.g. Acme Tech"
                    value="{{ default_company }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="location">Location *</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="e.g. Bangalore / Remote"
                    required
                >
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="salary">Compensation / Salary *</label>
                <input
                    type="text"
                    id="salary"
                    name="salary"
                    placeholder="e.g. ₹12 - ₹18 LPA"
                    required
                >
            </div>

            <div class="form-group">
                <label for="experience">Experience Level *</label>
                <input
                    type="text"
                    id="experience"
                    name="experience"
                    placeholder="e.g. 2 - 4 years"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="skills">Key Required Skills *</label>
            <input
                type="text"
                id="skills"
                name="skills"
                placeholder="e.g. Python, Django, REST APIs, PostgreSQL, Docker"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Job Description & Responsibilities *</label>
            <textarea
                id="description"
                name="description"
                rows="7"
                placeholder="Provide details about role responsibilities, team culture, and requirements..."
                required
            ></textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 10px;">
            <button type="submit" class="btn" style="flex: 1; padding: 12px;">
                🚀 Publish Job Opening
            </button>
            <a href="/recruiter-dashboard/" class="btn btn-secondary" style="padding: 12px 24px;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
